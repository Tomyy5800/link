# À placer dans .github/workflows/pterodactyl-release.yml du dépôt Tomyy5800/link.
#
# Compile le site sur les serveurs de GitHub (assez de mémoire pour Next.js) et publie le
# paquet prêt à l'emploi dans une release. Fonctionne que le dépôt contienne les sources à la
# racine ou une archive (.tar / .zip) du projet, comme Link-by-unclaim-main.tar.
#
# Lancement : onglet « Actions » › « Paquet Pterodactyl » › « Run workflow ».
# Lien direct à donner à l'egg (toujours la dernière release) :
#   https://github.com/Tomyy5800/link/releases/latest/download/link-by-unclaim-pterodactyl.tar.gz
name: Paquet Pterodactyl

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer les sources
        run: |
          if [ -f package.json ]; then
            echo "SRC_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p /tmp/src
          archive="$(ls Link-by-unclaim-main.tar *.tar *.zip 2>/dev/null | head -1 || true)"
          [ -n "$archive" ] || { echo "Aucune archive .tar/.zip ni package.json à la racine du dépôt."; exit 1; }
          echo "Archive utilisée : $archive"
          case "$archive" in
            *.zip) unzip -q "$archive" -d /tmp/src ;;
            *)     tar -xf "$archive" -C /tmp/src ;;
          esac
          pkg="$(find /tmp/src -maxdepth 2 -name package.json -not -path '*/node_modules/*' | head -1)"
          [ -n "$pkg" ] || { echo "package.json introuvable dans l'archive."; exit 1; }
          echo "SRC_DIR=$(dirname "$pkg")" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        working-directory: ${{ env.SRC_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Construire le paquet
        working-directory: ${{ env.SRC_DIR }}
        run: npm run build:pterodactyl

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('paquet-{0}', github.run_number) }}
          name: Paquet Pterodactyl ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
          make_latest: true
          files: ${{ env.SRC_DIR }}/deploy/link-by-unclaim-pterodactyl.tar.gz
